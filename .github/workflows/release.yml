name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Install GUI system headers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libxcb1-dev libxrandr-dev \
            libxi-dev libxcursor-dev libx11-dev libgl1-mesa-dev \
            libatk1.0-dev libgtk-3-dev libasound2-dev pkg-config

      - name: Build release binary
        run: cargo build --release --locked --target x86_64-unknown-linux-gnu

      - name: Package binary
        run: |
          mkdir -p dist/git2pkg
          cp target/x86_64-unknown-linux-gnu/release/git2pkg dist/git2pkg/
          cp README.md LICENSE dist/git2pkg/
          tar -czf git2pkg-linux-x86_64.tar.gz -C dist git2pkg
          sha256sum git2pkg-linux-x86_64.tar.gz > git2pkg-linux-x86_64.tar.gz.sha256

      - name: Prepare release notes
        run: |
          notes=".github/release-notes/${GITHUB_REF_NAME}.md"
          if [ ! -f "$notes" ]; then
            prev=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
            {
              echo "## Highlights"
              echo
              echo "See the commits for this release."
              echo
              echo "## Changes"
              echo
              if [ -n "$prev" ]; then
                git log --oneline "${prev}..${GITHUB_REF_NAME}" | sed 's/^/- /'
                echo
                echo "**Full Changelog**: https://github.com/${GITHUB_REPOSITORY}/compare/${prev}...${GITHUB_REF_NAME}"
              else
                git log --oneline -20 "${GITHUB_REF_NAME}" | sed 's/^/- /'
              fi
            } > "$notes"
          fi
          echo "RELEASE_NOTES=$notes" >> "$GITHUB_ENV"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            git2pkg-linux-x86_64.tar.gz
            git2pkg-linux-x86_64.tar.gz.sha256
          body_path: ${{ env.RELEASE_NOTES }}
          prerelease: ${{ contains(github.ref_name, '-alpha.') || contains(github.ref_name, '-beta.') || contains(github.ref_name, '-rc.') }}
