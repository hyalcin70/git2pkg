stages:
  - build

variables:
  CARGO_HOME: "$CI_PROJECT_DIR/.cargo"
  CARGO_TARGET_DIR: "$CI_PROJECT_DIR/target"

cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - .cargo/registry/
    - target/

build:linux-x86_64:
  stage: build
  image: rust:1.82-bookworm
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends
        pkg-config
        libxkbcommon-dev
        libwayland-dev
        libxcb1-dev
        libxrandr-dev
        libxi-dev
        libxcursor-dev
        libx11-dev
        libgl1-mesa-dev
        libatk1.0-dev
        libgtk-3-dev
        libasound2-dev
  script:
    - cargo build --release --locked
    - mkdir -p dist/git2pkg
    - cp target/release/git2pkg dist/git2pkg/
    - cp README.md LICENSE dist/git2pkg/
    - tar -czf git2pkg-linux-x86_64.tar.gz -C dist git2pkg
    - sha256sum git2pkg-linux-x86_64.tar.gz > git2pkg-linux-x86_64.tar.gz.sha256
  artifacts:
    name: "git2pkg-linux-x86_64"
    paths:
      - git2pkg-linux-x86_64.tar.gz
      - git2pkg-linux-x86_64.tar.gz.sha256
    expire_in: 1 week
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v.*/'
    - if: '$CI_PIPELINE_SOURCE == "push"'
